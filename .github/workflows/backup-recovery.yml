name: Temporary Parola backup recovery
on:
  push:
    branches: [qa/parola-backup-20261114]
    paths: [tests/browser/backup-recovery.mjs, scripts/run-backup-recovery.py, .github/workflows/backup-recovery.yml]
permissions:
  contents: read
concurrency:
  group: parola-backup-recovery-20261114
  cancel-in-progress: false
jobs:
  browser:
    if: github.repository == 'alvarovillalbaa/parola' && github.event.repository.private == false && github.ref == 'refs/heads/qa/parola-backup-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          check-latest: false
      - name: Four public backup and recovery journeys
        env:
          PAROLA_BACKUP_OUTPUT: ${{ runner.temp }}/parola-backup-output-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/run-backup-recovery.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: parola-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parola-backup-output-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
